<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>live-anm · 自测</title>
<link rel="stylesheet" href="./style.css">
<style>body{padding:20px}.r{font:13px/1.9 ui-monospace,monospace}.ok{color:#9ece6a}.no{color:#f7768e}</style>
</head><body>
<h1 style="font-size:16px">live-anm 浏览器自测</h1>
<p class="dim">Node 里的 312 个测试用的是 mock GL —— <b>真实 WebGL 的行为只有浏览器能验</b>。
这一页用仓库自带的合成夹具（零版权字节）跑一遍完整管线：解析 → 贴图解码 → VM → 几何 →
WebGL 提交 → <code>readPixels</code> 读回，确认「确实画上去了」而不是只跑通了调用。</p>
<canvas id="c" style="border:1px solid #2b303a;background:#000"></canvas>
<div id="out" class="r">跑起来…</div>
<script type="module">
const out = document.getElementById('out');
const log = [];
const say = (ok, msg) => { log.push(`<div class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${msg}</div>`); out.innerHTML = log.join(''); };
try {
  const { loadAnm, createPlayer } = await import('./player.js');
  const bytes = new Uint8Array(await (await fetch('../tests/fixtures/settings-ops.anm')).arrayBuffer());
  const file = loadAnm(bytes);
  say(file.entries.length > 0, `解析：${file.entries.length} entry / ${file.sprites.length} sprite / ${file.scripts.length} script`);
  const t = file.textures[0];
  say(!!t?.rgba, `THTX 解码：${t?.width}×${t?.height} format=${t?.format} → ${t?.rgba.length} 字节 RGBA`);
  const canvas = document.getElementById('c');
  const p = createPlayer(canvas, file, { width: 320, height: 240 });
  say(true, 'WebGL 上下文 + shader 编译链接通过');
  p.spawn(0, { entityPos: { x: 160, y: 120, z: 0 } });
  for (let i = 0; i < 5; i++) p.step();
  p.render();
  say(p.errors.length === 0, `跑 5 帧：运行时异常 ${p.errors.length} 个${p.errors[0] ? ' — ' + p.errors[0].message.slice(0,140) : ''}`);
  say(true, `drawList ${p.manager.drawList().length} 项 · skipped ${p.manager.skipped.length} 项`);
  const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  const px = new Uint8Array(320 * 240 * 4);
  gl.readPixels(0, 0, 320, 240, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let n = 0; for (let i = 0; i < px.length; i += 4) if (px[i] || px[i+1] || px[i+2]) n++;
  say(n > 0, `readPixels：非黑像素 ${n} 个 —— ${n > 0 ? '确实画上去了' : '画布是全黑的，管线在某处断了'}`);
} catch (e) {
  say(false, '异常：' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e));
}
</script>
</body></html>
