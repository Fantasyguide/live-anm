# 构建并发布到 GitHub Pages。
#
# 标准的 Vite 工作流：`npm ci` → `npm test` → `npm run build` → 发 dist/。
# base 在 vite.config.js 里固定成 '/live-anm/'（Pages 挂在 /<repo>/ 下，默认的 '/' 会 404）。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 测试本身不需要任何依赖（裸 node --test），但装完再跑顺带验了锁文件是好的
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # 首次推送时 Pages 还没启用，不加这个 configure-pages 会以
          # 「Get Pages site failed / Not Found」失败。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
